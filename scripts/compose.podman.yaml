services:
  fsdr-api:
    image: localhost/oci-opensearch-fsdr:local
    container_name: oci-opensearch-fsdr
    network_mode: host
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:mode=0700
    environment:
      FSDR_API_HOST: 127.0.0.1
      FSDR_API_PORT: 1604
      FSDR_CONFIG: /etc/oci-opensearch-fsdr/config.json
      FSDR_API_JOB_DIR: /var/lib/oci-opensearch-fsdr/api-jobs
    volumes:
      - /opt/oci-opensearch-fsdr/runtime/config:/etc/oci-opensearch-fsdr:ro
      - /opt/oci-opensearch-fsdr/runtime/state:/var/lib/oci-opensearch-fsdr:rw
      - /opt/oci-opensearch-fsdr/runtime/log:/var/log/oci-opensearch-fsdr:rw
    restart: unless-stopped
