services:
  fsdr-api:
    build:
      context: .
    image: oci-opensearch-fsdr:local
    container_name: oci-opensearch-fsdr
    # Instance Principal and private OpenSearch endpoints use the VM network.
    network_mode: host
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:mode=0700
    environment:
      FSDR_API_HOST: 127.0.0.1
      FSDR_API_PORT: 1604
      FSDR_CONFIG: /etc/oci-opensearch-fsdr/config.json
      FSDR_API_JOB_DIR: /var/lib/oci-opensearch-fsdr/api-jobs
    volumes:
      - ./runtime/config:/etc/oci-opensearch-fsdr:ro
      - ./runtime/state:/var/lib/oci-opensearch-fsdr:rw
      - ./runtime/log:/var/log/oci-opensearch-fsdr:rw
    restart: unless-stopped
